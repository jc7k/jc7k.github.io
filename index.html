<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>YouTube Feedback Demo (Frontend-only)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      color: #333;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at top right, rgba(255, 255, 255, 0.1), transparent),
                  radial-gradient(circle at bottom left, rgba(255, 255, 255, 0.1), transparent);
      pointer-events: none;
    }

    main {
      text-align: center;
      margin-bottom: 2rem;
      animation: fadeInDown 0.8s ease;
      z-index: 1;
    }

    h1 {
      color: white;
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
    }

    main p {
      color: rgba(255, 255, 255, 0.9);
      font-size: 1.1rem;
      font-weight: 300;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      border-radius: 2rem;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      color: white;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      margin-bottom: 0.5rem;
    }

    #yt-container {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16/9;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25),
                  0 0 0 1px rgba(255, 255, 255, 0.1);
      animation: fadeInUp 0.8s ease 0.2s both;
      z-index: 1;
    }

    #yt-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    #feedbackModal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      z-index: 9999;
      animation: fadeIn 0.3s ease;
    }

    .card {
      background: white;
      padding: 2rem;
      max-width: 420px;
      width: 92%;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                  0 0 0 1px rgba(255, 255, 255, 0.1);
      animation: slideUp 0.3s ease;
    }

    .card h3 {
      color: #333;
      font-size: 1.5rem;
      font-weight: 500;
      margin-bottom: 1rem;
    }

    .row {
      margin: 1rem 0;
    }

    label {
      display: block;
      color: #555;
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    select, textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: all 0.2s ease;
      background: #fafafa;
    }

    select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      cursor: pointer;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    button[type="submit"] {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    button[type="submit"]:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    #skipBtn {
      background: #f5f5f5;
      color: #666;
    }

    #skipBtn:hover {
      background: #e8e8e8;
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      color: #333;
      padding: 12px 24px;
      border-radius: 8px;
      display: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      animation: slideUp 0.3s ease;
    }

    #status {
      color: #667eea;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }

    #cueInfo {
      color: #888;
      font-size: 0.9rem;
      margin: 0.5rem 0 1rem;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }

      body {
        padding: 1rem;
      }

      #yt-container {
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>YouTube Feedback Demo</h1>
    <p>
      <span class="badge">Frontend-only</span><br>
      This PoC pauses at <strong>5s</strong> and <strong>30s</strong> to show a pulse form. No data is sent anywhere.
    </p>
  </main>

  <div id="yt-container"></div>

  <!-- Modal -->
  <div id="feedbackModal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="card">
      <h3 id="modal-title" style="margin-top:0">Quick pulse check</h3>
      <form id="pulseForm">
        <p id="cueInfo" style="margin:.25rem 0 .75rem; color:#666;"></p>
        <div class="row">
          <label>How helpful is this so far?
            <select name="helpfulness" required>
              <option value="">Choose…</option>
              <option>Very helpful</option>
              <option>Somewhat helpful</option>
              <option>Neutral</option>
              <option>Not very helpful</option>
              <option>Not helpful at all</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label>One thing we could improve?
            <textarea name="comment" rows="3" placeholder="(optional)"></textarea>
          </label>
        </div>
        <div class="row" style="display:flex;gap:.5rem;justify-content:flex-end">
          <button type="button" id="skipBtn">Skip</button>
          <button type="submit">Submit</button>
        </div>
        <p id="status" style="font-size:.9rem;color:#666;margin:.4rem 0 0;"></p>
      </form>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <!-- YT API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <!-- Config -->
  <script>
    const VIDEO_ID   = "JnBy7Af_2e0";  // Google Cloud: Intro to Generative AI
    const CUES       = [5, 30];        // seconds
  </script>

  <!-- Controller (no backend) -->
  <script>
    let player, pollId=null, lastT=0;
    const triggered = new Set();

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-container', {
        videoId: VIDEO_ID,
        playerVars: { rel: 0, modestbranding: 1 },
        events: { onReady, onStateChange }
      });
    }
    function onReady() {}
    function onStateChange(e) {
      if (e.data === YT.PlayerState.PLAYING) startPolling();
      else stopPolling();
    }
    function startPolling(){
      if (pollId) return;
      lastT = player.getCurrentTime();
      pollId = setInterval(() => {
        const t = player.getCurrentTime();
        for (const cue of CUES) {
          if (!triggered.has(cue) && crossed(lastT, t, cue, 0.5)) {
            triggered.add(cue);
            player.pauseVideo();
            openModal(cue);
          }
        }
        lastT = t;
      }, 300);
    }
    function stopPolling(){ clearInterval(pollId); pollId=null; }
    function crossed(prev, now, cue, tol){
      const a = Math.min(prev, now), b = Math.max(prev, now);
      return (a - tol) < cue && cue <= (b + tol);
    }

    // Modal logic
    const modal = document.getElementById('feedbackModal');
    const form  = document.getElementById('pulseForm');
    const statusEl = document.getElementById('status');
    const cueInfo = document.getElementById('cueInfo');
    const toast = document.getElementById('toast');
    let currentCue = null;

    function openModal(cue){
      currentCue = cue;
      cueInfo.textContent = `Cue @ ${cue.toFixed(0)}s`;
      statusEl.textContent = "";
      modal.style.display = 'grid';
      announce(`Cue reached at ${cue.toFixed(0)} seconds`);
      console.log("[demo] Showing form at cue:", cue);
    }
    function closeModal(){ modal.style.display = 'none'; }

    document.getElementById('skipBtn').onclick = () => {
      closeModal(); player.playVideo();
    };

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const data = {
        video_id: VIDEO_ID,
        at_seconds: currentCue,
        helpfulness: form.helpfulness.value,
        comment: form.comment.value || null,
      };
      console.log("[demo] Submission (not sent):", data);
      statusEl.textContent = "Saved locally (demo only). Resuming…";
      setTimeout(() => { closeModal(); player.playVideo(); }, 400);
    });

    function announce(msg){
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 1500);
    }
  </script>
</body>
</html>
